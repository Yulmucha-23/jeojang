<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border: 2px solid blue;
        border-collapse: collapse;
      }
      td,
      th {
        border: 1px dotted green;
      }
      tr:nth-child(even) {
        background-color: pink;
      }
      tr:nth-child(odd) {
        background-color: greenyellow;
      }
      tr:hover {
        background-color: cyan;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>이름</th>
          <th>HTML</th>
          <th>CSS</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>황기태</th>
          <th>80</th>
          <th>70</th>
        </tr>
        <tr>
          <td>이재문</td>
          <td>95</td>
          <td>99</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <th>황기태</th>
          <th>80</th>
          <th>70</th>
        </tr>
        <tr>
          <td>이재문</td>
          <td>95</td>
          <td>99</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>합</td>
          <td>175</td>
          <td>169</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
