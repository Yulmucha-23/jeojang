<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @keyframes BIG {
        0% {
          color: blue;
          font-size: 100%;
        }
        50% {
          color: green;
          font-size: 500%;
        }
        100% {
          color: red;
          font-size: 100%;
        }
      }
      span {
        animation-name: BIG;
        animation-duration: 3s;
        animation-iteration-count: infinite;
      }
    </style>
  </head>
  <body>
    <p style="font-size: 24px"><span>글씨</span>팽창</p>
  </body>
</html>
