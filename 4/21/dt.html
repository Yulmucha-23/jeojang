    }

<section>

        <dl>

            </dt>
        </dl>                                  
        <dl>
            <dt>가룡-반가
                <dd>경에 나오는, 사람의 머리를</dd>
            </dt>
        </dl>
        <dl>
            <dt>가인-박명
                <dd>미인은 불행하거나 병약</dd>
            </dt>
        </dl>
        <dl>
            <dt>가통지사
                <dd>통탄할 만한 일</dd>
            </dt>
        </dl>
    </article>
</section>
<footer></footer>

</html>
