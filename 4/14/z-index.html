<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        position: absolute;
      }
      img {
        position: absolute;
      }
      #cat1 {
        z-index: 1;
        left: 60px;
        top: 40px;
      }
      #cat2 {
        z-index: 2;
        left: 100px;
        top: 80px;
      }
      #cat3 {
        z-index: 3;
        left: 140px;
        top: 120px;
      }
      #cat4 {
        z-index: 4;
        left: 180px;
        top: 160px;
      }
    </style>
  </head>
  <body>
    <div>
      <img id="cat1" src="https://placecats.com/200/100" alt="cat1" />
      <img id="cat2" src="https://placecats.com/200/400" alt="cat2" />
      <img id="cat3" src="https://placecats.com/300/300" alt="cat3" />
      <img id="cat4" src="https://placecats.com/400/300" alt="cat4" />
    </div>
  </body>
</html>
